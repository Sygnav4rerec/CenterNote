<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <title>Centered Notes</title>
  <style>
    :root {
      --bg: #0b0b0b;
      --fg: #e9e9e9;
      --muted: #8a8a8a;
      --accent: #b3b3b3;
      --danger: #ff5d5d;
      --line-size: 18px;      /* history text size */
      --input-size: 30px;     /* input text size */
      --ui-size: 14px;
      --max-width: 1000px;
      --toolbar-h: 96px;      /* toolbar height for calculations */
      --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Layout: fixed centered input with history above */
    .app {
      height: 100svh; /* steadier on mobile than 100vh */
      width: 100vw;
      position: relative;
      overflow: hidden;
    }

    .inner {
      width: min(100%, var(--max-width));
      padding: 24px clamp(16px, 4vw, 40px);
    }

    /* Top toolbar with icons */
    .topbar {
      position: fixed;
      top: 10px;
      right: 12px;
      z-index: 10;
      user-select: none;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .icon-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: var(--fg);
      background: transparent;
      border: 1px solid #222;
      border-radius: 6px;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity .2s ease, background .2s ease, border-color .2s ease;
    }
    .icon-btn:hover { opacity: 1; border-color: #333; background: #111; }
    .menu-btn {
      font: 600 var(--ui-size)/1 var(--font);
      color: var(--fg);
      background: transparent;
      border: 1px solid #222;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity .2s ease, background .2s ease, border-color .2s ease;
    }
    .menu-btn:hover { opacity: 1; border-color: #333; background: #111; }

    .dropdown {
      position: absolute;
      top: 40px;
      right: 0;
      min-width: 280px;
      max-height: 300px;
      background: #0f0f0f;
      border: 1px solid #1e1e1e;
      border-radius: 12px;
      padding: 6px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.55);
      display: none;
      overflow-y: auto;
    }
    .dropdown.open { display: block; }
    .dropdown .note-item {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      color: var(--fg);
      font: 400 var(--ui-size)/1.3 var(--font);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }
    .dropdown .note-item:hover { background: #161616; }
    .dropdown .empty-state {
      padding: 20px 12px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    /* History text window (upper area) */
    .history-wrap {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: min(100%, var(--max-width));
      height: calc(50svh - 200px); /* much more separation from input */
      overflow: visible;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding-bottom: 40px; /* extra buffer space */
    }
    .history {
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0 clamp(16px, 4vw, 40px) 20px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start; /* start from top, scroll naturally */
      gap: 6px;
      scroll-behavior: smooth;
      scrollbar-gutter: stable;
    }
    .history:empty {
      display: none;
    }

    .line { 
      font-size: var(--line-size);
      line-height: 1.55; /* slightly tighter */
      letter-spacing: 0.01em;
      color: var(--accent);
      word-break: break-word;
      white-space: pre-wrap;
      opacity: .9;
      user-select: text;
      cursor: pointer; /* indicates clickable */
      padding: 3px 4px;
      border-radius: 4px;
      transition: all 0.15s ease;
    }
    
    .line:hover {
      opacity: 1;
      background: rgba(255,255,255,0.04);
      transform: translateX(2px);
    }

    .line.editing {
      background: rgba(255,255,255,0.08);
      padding: 4px 8px;
      border-radius: 6px;
      outline: 1px solid var(--accent);
      cursor: text;
      user-select: text;
    }

    /* Current input window (center area) */
    .input-wrap { 
      position: fixed;
      top: calc(60svh); /* move down to avoid overlap */
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(100%, var(--max-width));
      padding: 20px clamp(16px, 4vw, 40px);
      z-index: 10; /* higher z-index */
      background: rgba(11,11,11,0.95); /* more opaque background */
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .input {
      width: 100%;
      outline: none;
      border: 0;
      background: transparent;
      caret-color: var(--fg);
      color: var(--fg);
      font-family: var(--mono);
      font-size: var(--input-size);
      line-height: 1.5;
      text-align: left;
      min-height: calc(var(--input-size) * 1.5);
      max-height: 40vh; /* limit height but allow expansion */
      overflow-y: auto;
      padding: 8px;
      resize: none;
    }

    /* Contenteditable placeholder */
    .input[contenteditable][data-placeholder]:empty::before {
      content: attr(data-placeholder);
      pointer-events: none;
      color: var(--muted);
    }

    /* Bottom spacer (keeps input centered) */
    .spacer { height: 100%; }

    /* Instructional hint at the top-left */
    .hint {
      position: fixed;
      left: 14px;
      top: 14px;
      color: var(--muted);
      font: 500 11px/1.3 var(--mono);
      opacity: .7;
      user-select: none;
      z-index: 5;
    }
    .hint kbd {
      background: #121212;
      padding: 1px 4px;
      border-radius: 4px;
      border: 1px solid #1f1f1f;
      font-family: var(--mono);
      font-size: 10px;
    }

    /* Glyph category menu (bottom left) */
    .glyph-menu {
      position: fixed;
      left: 14px;
      bottom: 14px;
      z-index: 10;
    }
    .glyph-toggle {
      background: #131313;
      border: 1px solid #1e1e1e;
      color: var(--fg);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font: 500 12px/1 var(--font);
      opacity: 0.8;
      transition: opacity .2s ease;
      min-width: 80px;
      text-align: center;
    }
    .glyph-toggle:hover { opacity: 1; }
    
    .glyph-panel {
      position: absolute;
      bottom: 40px;
      left: 0;
      width: 280px;
      max-height: 350px;
      background: #0f0f0f;
      border: 1px solid #1e1e1e;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.55);
      display: none;
      overflow-y: auto;
    }
    .glyph-panel.open { display: block; }
    
    .category-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    .cat-btn {
      background: #161616;
      border: 1px solid #222;
      color: var(--fg);
      padding: 10px 8px;
      border-radius: 8px;
      cursor: pointer;
      font: 500 11px/1.2 var(--font);
      text-align: center;
      transition: background .2s ease;
    }
    .cat-btn:hover { background: #202020; }
    .cat-btn small {
      display: block;
      color: var(--muted);
      font-size: 9px;
    }

    /* Bottom toolbar for symbols (3 rows) */
    .toolbar {
      position: fixed; left: 0; right: 0; bottom: 0; height: var(--toolbar-h);
      border-top: 1px solid #161616;
      background: linear-gradient(0deg, rgba(0,0,0,.45), rgba(0,0,0,0));
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom)) 120px;
      display: grid;
      grid-template-rows: repeat(3, 28px);
      grid-auto-flow: column;
      grid-auto-columns: max-content;
      gap: 6px 8px;
      overflow-x: auto;
      align-content: center;
    }
    .sym { 
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 40px; height: 32px; /* slightly larger for better touch */
      font: 600 18px/1 var(--mono);
      color: var(--fg);
      background: #131313; border: 1px solid #1e1e1e;
      border-radius: 10px; cursor: pointer;
      user-select: none;
    }
    .sym:hover { filter: brightness(1.15); }

    /* Hide scrollbars (still scrollable) */
    .history { scrollbar-width: none; }
    .history::-webkit-scrollbar { width: 0; height: 0; }

    /* Accessibility: respect reduced motion preference */
    @media (prefers-reduced-motion: reduce) {
      .history { scroll-behavior: auto; }
      .line { transition: none; }
    }
    
    /* Responsive tweaks */
    @media (max-width: 520px) {
      :root { --input-size: 26px; --line-size: 16px; }
      .menu-btn { padding: 8px 10px; }
      .dropdown { min-width: 200px; }
    }
  </style>
</head>
<body>
  <div class="topbar" aria-label="Menu">
    <button id="newNote" class="icon-btn" title="Create new note">➕</button>
    <button id="copyText" class="icon-btn" title="Copy current note">📋</button>
    <button id="exportTxt" class="icon-btn" title="Export as .txt">💾</button>
    <button id="increaseFont" class="icon-btn" title="Increase text size">🔍</button>
    <button id="decreaseFont" class="icon-btn" title="Decrease text size">🔎</button>
    <button id="clearAll" class="icon-btn" title="Clear current note">🗑</button>
    <button id="menuBtn" class="menu-btn" title="Notes">Notes ▾</button>
    <div id="menu" class="dropdown" role="menu" aria-hidden="true">
      <div id="notesList"></div>
    </div>
  </div>

  <main class="app" id="app" aria-label="Centered Notes">
    <section class="history-wrap">
      <div class="history" id="history" aria-live="polite"></div>
    </section>

    <section class="input-wrap">
      <div id="editor" class="input" contenteditable spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" data-placeholder="Type, then press Enter… (Shift+Enter for newline)"></div>
    </section>

    <div class="toolbar" id="toolbar" aria-label="Symbols toolbar"></div>
  </main>

  <div class="glyph-menu">
    <button id="glyphToggle" class="glyph-toggle">Glyphs ▲</button>
    <div id="glyphPanel" class="glyph-panel" aria-hidden="true">
      <div id="categoryGrid" class="category-grid"></div>
      <div style="font-size: 11px; color: var(--muted); text-align: center; margin-top: 8px;">Select a category to load glyphs</div>
    </div>
  </div>

  <div class="hint">Enter → commit • Shift+Enter → newline • <kbd>Esc</kbd> → clear</div>

  <script>
    ;(() => {
      const STORAGE_KEY = 'centered-notes-v1';
      const NOTES_KEY = 'centered-notes-list';
      const state = {
        lines: [],
        lineSize: parseInt(getComputedStyle(document.documentElement).getPropertyValue('--line-size')),
        inputSize: parseInt(getComputedStyle(document.documentElement).getPropertyValue('--input-size')),
        currentNote: null,
        notes: []
      };
      
      // Glyph categories
      const categories = {
        'Greek': ['α','β','γ','δ','ε','ζ','η','θ','ι','κ','λ','μ','ν','ξ','ο','π','ρ','σ','τ','υ','φ','χ','ψ','ω','Γ','Δ','Θ','Λ','Ξ','Π','Σ','Φ','Ψ','Ω'],
        'Operators': ['±','×','÷','∙','⋅','·','≈','≠','≤','≥','≡','∝','∴','∵','∥','⊥','≅','≃','≜','∓','∂'],
        'Math': ['√','∛','∜','∑','∏','∫','∬','∭','∮','∞','∇','∆','∂','′','″','‴','°'],
        'Geometry': ['∠','⊾','∟','⟂','∥','⊙','⊕','⊗','⊡','△','▭','◻','◇','◯','∘'],
        'Chemistry': ['→','⇌','⇋','⇄','⇅','⇆','⟶','⟷','↑','↓','Å','°','•','⟨','⟩'],
        'Arrows': ['→','←','↑','↓','↔','↕','⇒','⇐','⇑','⇓','⇔','⟶','⟵','⟷'],
        'Currency': ['$','€','£','¥','₩','₹','₽','₺','₫','₴','₦','₪','₱','₿'],
        'Symbols': ['☀','☁','★','☆','☎','☑','☒','♠','♣','♥','♦','♪','♫','♬']
      };
      let currentCategory = 'Greek';

      const historyEl = document.getElementById('history');
      const editor = document.getElementById('editor');
      const app = document.getElementById('app');
      const menu = document.getElementById('menu');
      const menuBtn = document.getElementById('menuBtn');
      const toolbar = document.getElementById('toolbar');
      const glyphToggle = document.getElementById('glyphToggle');
      const glyphPanel = document.getElementById('glyphPanel');
      const categoryGrid = document.getElementById('categoryGrid');
      const notesList = document.getElementById('notesList');

      // Focus editor on load and on background click
      window.addEventListener('load', () => editor.focus());
      app.addEventListener('pointerdown', (e) => {
        if (!menu.contains(e.target) && e.target !== menuBtn) {
          menu.classList.remove('open');
          editor.focus();
        }
      });

      // Toggle menu
      menuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        menu.classList.toggle('open');
        menu.setAttribute('aria-hidden', menu.classList.contains('open') ? 'false' : 'true');
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          // Close menu or clear input if menu is closed
          if (menu.classList.contains('open')) {
            menu.classList.remove('open');
            menu.setAttribute('aria-hidden', 'true');
          } else {
            editor.textContent = '';
          }
        }
      });

      // Load from storage
      function load() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            // Create default note
            createNewNote();
            return;
          }
          const data = JSON.parse(raw);
          if (Array.isArray(data.lines)) {
            state.lines = data.lines;
            renderHistory();
          }
          if (data.lineSize) setLineSize(data.lineSize);
          if (data.inputSize) setInputSize(data.inputSize);
          
          loadNotes();
        } catch (_) {}
      }

      function save() {
        const payload = {
          lines: state.lines,
          lineSize: state.lineSize,
          inputSize: state.inputSize
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        saveCurrentNote();
      }
      
      function loadNotes() {
        try {
          const raw = localStorage.getItem(NOTES_KEY);
          if (raw) {
            state.notes = JSON.parse(raw);
            renderNotesList();
          }
        } catch (_) {}
      }
      
      function saveNotes() {
        localStorage.setItem(NOTES_KEY, JSON.stringify(state.notes));
      }
      
      function createNewNote() {
        const noteId = Date.now().toString();
        const note = {
          id: noteId,
          title: 'New Note',
          lines: [],
          created: new Date().toISOString()
        };
        state.notes.push(note);
        state.currentNote = noteId;
        state.lines = [];
        renderHistory();
        saveNotes();
        renderNotesList();
      }
      
      function saveCurrentNote() {
        if (!state.currentNote) return;
        const note = state.notes.find(n => n.id === state.currentNote);
        if (note) {
          note.lines = [...state.lines];
          note.title = state.lines[0] || 'New Note';
          saveNotes();
          renderNotesList();
        }
      }
      
      function renderNotesList() {
        if (!notesList) return;
        notesList.innerHTML = '';
        
        if (state.notes.length === 0) {
          notesList.innerHTML = '<div class="empty-state">No notes yet</div>';
          return;
        }
        
        state.notes.forEach(note => {
          const div = document.createElement('div');
          div.className = 'note-item';
          div.textContent = note.title;
          div.title = note.title;
          div.addEventListener('click', () => {
            loadNote(note.id);
            menu.classList.remove('open');
          });
          notesList.appendChild(div);
        });
      }
      
      function loadNote(noteId) {
        const note = state.notes.find(n => n.id === noteId);
        if (note) {
          state.currentNote = noteId;
          state.lines = [...note.lines];
          renderHistory();
          save();
        }
      }

      // Render history lines (FIXED VERSION)
      function renderHistory() {
        historyEl.innerHTML = '';
        const frag = document.createDocumentFragment();
        state.lines.forEach((text, idx) => {
          const div = document.createElement('div');
          div.className = 'line';
          div.dataset.index = idx;
          div.textContent = text;
          frag.appendChild(div);
        });
        historyEl.appendChild(frag);
        // Scroll to bottom to show newest entries
        setTimeout(() => {
          historyEl.scrollTop = historyEl.scrollHeight;
        }, 0);
      }

      function addLine(text) {
        state.lines.push(text);
        renderHistory();
        save();
      }

      // Size helpers
      function setLineSize(px) {
        state.lineSize = Math.max(12, Math.min(28, px));
        document.documentElement.style.setProperty('--line-size', state.lineSize + 'px');
        save();
      }
      function setInputSize(px) {
        state.inputSize = Math.max(20, Math.min(56, px));
        document.documentElement.style.setProperty('--input-size', state.inputSize + 'px');
        save();
      }

      // Editor behavior
      editor.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          const text = editor.textContent.replace(/\s+$/,'');
          if (text.length) {
            addLine(text);
            editor.textContent = '';
          }
          return;
        }
      });

      // ====== Inline edit of submitted lines (single click) ======
      historyEl.addEventListener('click', (e) => {
        const target = e.target.closest('.line');
        if (!target || target.classList.contains('editing')) return;
        enterEdit(target);
      });

      function enterEdit(el) {
        if (el.classList.contains('editing')) return;
        el.classList.add('editing');
        el.contentEditable = 'true';
        // move caret to end
        const range = document.createRange();
        range.selectNodeContents(el);
        range.collapse(false);
        const sel = window.getSelection();
        sel.removeAllRanges(); sel.addRange(range);

        function finish(commit) {
          el.removeEventListener('keydown', onKey);
          el.removeEventListener('blur', onBlur);
          el.contentEditable = 'false';
          el.classList.remove('editing');
          if (commit) {
            const idx = Number(el.dataset.index);
            state.lines[idx] = el.textContent;
            save();
          } else {
            renderHistory(); // discard uncommitted HTML
          }
        }
        function onKey(ev) {
          if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); finish(true); }
          if (ev.key === 'Escape') { ev.preventDefault(); finish(false); }
        }
        function onBlur() { finish(true); }
        el.addEventListener('keydown', onKey);
        el.addEventListener('blur', onBlur);
      }

      // Icon actions
      document.getElementById('newNote').addEventListener('click', () => {
        createNewNote();
        editor.focus();
      });
      
      document.getElementById('copyText').addEventListener('click', () => {
        const text = state.lines.join('\n');
        navigator.clipboard.writeText(text).then(() => {
          // Brief visual feedback
          const btn = document.getElementById('copyText');
          const original = btn.textContent;
          btn.textContent = '✓';
          setTimeout(() => btn.textContent = original, 800);
        }).catch(() => {
          // Fallback for older browsers
          const textArea = document.createElement('textarea');
          textArea.value = text;
          document.body.appendChild(textArea);
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
        });
      });
      
      document.getElementById('exportTxt').addEventListener('click', () => {
        const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
        const text = state.lines.join('\n');
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `centered-notes-${timestamp}.txt`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      });

      document.getElementById('increaseFont').addEventListener('click', () => {
        setInputSize(state.inputSize + 2);
        setLineSize(state.lineSize + 1);
      });
      
      document.getElementById('decreaseFont').addEventListener('click', () => {
        setInputSize(state.inputSize - 2);
        setLineSize(state.lineSize - 1);
      });

      document.getElementById('clearAll').addEventListener('click', () => {
        if (confirm('Clear current note? This cannot be undone.')) {
          state.lines = [];
          save();
          renderHistory();
        }
      });

      // Close dropdown when clicking outside
      document.addEventListener('pointerdown', (e) => {
        if (!menu.contains(e.target) && e.target !== menuBtn) {
          menu.classList.remove('open');
        }
      });

      // Category management and toolbar rendering
      function renderCategoryButtons() {
        if (!categoryGrid) return;
        categoryGrid.innerHTML = '';
        Object.entries(categories).forEach(([name, symbols]) => {
          const btn = document.createElement('button');
          btn.className = 'cat-btn';
          btn.innerHTML = `${name}<small>${symbols.length} glyphs</small>`;
          btn.addEventListener('click', () => {
            currentCategory = name;
            renderToolbar();
            glyphPanel.classList.remove('open');
          });
          categoryGrid.appendChild(btn);
        });
      }

      function renderToolbar() {
        if (!toolbar) return;
        toolbar.innerHTML = '';
        const symbols = categories[currentCategory] || [];
        symbols.forEach(s => {
          const b = document.createElement('button');
          b.className = 'sym';
          b.type = 'button';
          b.textContent = s;
          b.title = `Insert ${s}`;
          b.addEventListener('click', () => insertAtCaret(getActiveEditable(), s));
          toolbar.appendChild(b);
        });
      }
      
      // Glyph panel toggle
      if (glyphToggle && glyphPanel) {
        glyphToggle.addEventListener('click', () => {
          const open = glyphPanel.classList.toggle('open');
          glyphPanel.setAttribute('aria-hidden', open ? 'false' : 'true');
          glyphToggle.textContent = open ? 'Glyphs ▼' : 'Glyphs ▲';
        });
        
        // Close panel when clicking outside
        document.addEventListener('click', (e) => {
          if (!glyphToggle.contains(e.target) && !glyphPanel.contains(e.target)) {
            glyphPanel.classList.remove('open');
            glyphPanel.setAttribute('aria-hidden', 'true');
            glyphToggle.textContent = 'Glyphs ▲';
          }
        });
      }

      function getActiveEditable(){
        const editing = document.querySelector('.line.editing');
        return editing || editor;
      }

      function insertAtCaret(el,text){
        el.focus();
        const sel=window.getSelection();
        if(!sel||!sel.rangeCount){ el.textContent+=text; return; }
        const range=sel.getRangeAt(0);
        range.deleteContents();
        range.insertNode(document.createTextNode(text));
        range.collapse(false);
        sel.removeAllRanges(); sel.addRange(range);
      }

      // Initialize
      renderCategoryButtons();
      renderToolbar();
      load();
    })();
  </script>
</body>
</html>
