<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <title>Centered Notes</title>
  <style>
    :root {
      --bg: #0b0b0b;
      --fg: #e9e9e9;
      --muted: #8a8a8a;
      --accent: #b3b3b3;
      --danger: #ff5d5d;
      --line-size: 24px;      /* history text size (scaled with 32pt input) */
      --input-size: 43px;     /* input text size (32pt) */
      --ui-size: 14px;
      --max-width: 1000px;
      --toolbar-h: 96px;      /* toolbar height for calculations */
      --center-gap: 22px;     /* gap between history and input areas */
      --font: "Helvetica Neue", Helvetica, ui-sans-serif, system-ui, -apple-system, sans-serif;
      --mono: "Helvetica Neue", Helvetica, ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Layout: fixed centered input with history above */
    .app {
      height: 100svh; /* steadier on mobile than 100vh */
      width: 100vw;
      position: relative;
      overflow: hidden;
    }

    .inner {
      width: min(100%, var(--max-width));
      padding: 24px clamp(16px, 4vw, 40px);
    }

    /* Top toolbar with icons */
    .topbar {
      position: fixed;
      top: 10px;
      right: 12px;
      z-index: 10;
      user-select: none;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .icon-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: var(--fg);
      background: transparent;
      border: 1px solid #222;
      border-radius: 6px;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity .2s ease, background .2s ease, border-color .2s ease;
    }
    .icon-btn:hover { opacity: 1; border-color: #333; background: #111; }
    .menu-btn {
      font: 600 var(--ui-size)/1 var(--font);
      color: var(--fg);
      background: transparent;
      border: 1px solid #222;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity .2s ease, background .2s ease, border-color .2s ease;
    }
    .menu-btn:hover { opacity: 1; border-color: #333; background: #111; }

    .dropdown {
      position: absolute;
      top: 40px;
      right: 0;
      min-width: 280px;
      max-height: 300px;
      background: #0f0f0f;
      border: 1px solid #1e1e1e;
      border-radius: 12px;
      padding: 6px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.55);
      display: none;
      overflow-y: auto;
    }
    .dropdown.open { display: block; }
    .dropdown .note-item {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      color: var(--fg);
      font: 400 var(--ui-size)/1.3 var(--font);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }
    .dropdown .note-item:hover { background: #161616; }
    .dropdown .empty-state {
      padding: 20px 12px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    /* History text window (upper area) */
    .history-wrap {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: min(100%, var(--max-width));
      height: calc(45svh - 120px);
      overflow: visible;
      padding-bottom: var(--center-gap);
    }
    .history {
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0 clamp(16px, 4vw, 40px) 20px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start; /* start from top, scroll naturally */
      gap: 6px;
      user-select: text; /* Enable text selection in history */
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      scroll-behavior: smooth;
      scrollbar-gutter: stable;
    }
    .history:empty {
      display: none;
    }

    .line { 
      font-size: var(--line-size);
      line-height: 1.55; /* slightly tighter */
      letter-spacing: 0.01em;
      color: var(--accent);
      word-break: break-word;
      white-space: pre-wrap;
      opacity: .9;
      user-select: text; /* Enable text selection */
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      cursor: text; /* Text cursor for selection */
      padding: 3px 4px;
      border-radius: 4px;
      transition: all 0.15s ease;
    }
    
    .line:hover {
      opacity: 1;
      background: rgba(255,255,255,0.04);
      transform: translateX(2px);
    }

    .line.editing {
      background: rgba(255,255,255,0.08);
      padding: 4px 8px;
      border-radius: 6px;
      outline: 1px solid var(--accent);
      cursor: text;
      user-select: text;
    }

    /* Current input window (center area) */
    .input-wrap { 
      position: fixed;
      top: calc(50svh + var(--center-gap)/2); /* offset by half the gap */
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(100%, var(--max-width));
      padding: 40px clamp(24px, 6vw, 60px); /* expanded padding for larger area */
      z-index: 10;
      /* All borders and visual separators removed for clean look */
    }

    .input {
      width: 100%;
      outline: none;
      border: 0;
      background: transparent;
      caret-color: var(--fg);
      color: var(--fg);
      font-family: var(--mono);
      font-size: var(--input-size);
      line-height: 1.5;
      text-align: left;
      min-height: calc(var(--input-size) * 1.5);
      max-height: 40vh; /* limit height but allow expansion */
      overflow-y: auto;
      padding: 8px;
      resize: none;
    }

    /* Contenteditable placeholder */
    .input[contenteditable][data-placeholder]:empty::before {
      content: attr(data-placeholder);
      pointer-events: none;
      color: var(--muted);
    }

    /* Bottom spacer (keeps input centered) */
    .spacer { height: 100%; }

    /* Instructional hint at the top-left */
    .hint {
      position: fixed;
      left: 14px;
      top: 14px;
      color: var(--muted);
      font: 500 11px/1.3 var(--mono);
      opacity: .7;
      user-select: none;
      z-index: 5;
    }
    .hint kbd {
      background: #121212;
      padding: 1px 4px;
      border-radius: 4px;
      border: 1px solid #1f1f1f;
      font-family: var(--mono);
      font-size: 10px;
    }

    /* Glyph category menu (bottom left) */
    .glyph-menu {
      position: fixed;
      left: 14px;
      bottom: 14px;
      z-index: 10;
    }
    .glyph-toggle {
      background: #131313;
      border: 1px solid #1e1e1e;
      color: var(--fg);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font: 500 12px/1 var(--font);
      opacity: 0.8;
      transition: opacity .2s ease;
      min-width: 80px;
      text-align: center;
    }
    .glyph-toggle:hover { opacity: 1; }
    
    .glyph-panel {
      position: absolute;
      bottom: 40px;
      left: 0;
      width: 280px;
      max-height: 350px;
      background: #0f0f0f;
      border: 1px solid #1e1e1e;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.55);
      display: none;
      overflow-y: auto;
    }
    .glyph-panel.open { display: block; }
    
    .category-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    .cat-btn {
      background: #161616;
      border: 1px solid #222;
      color: var(--fg);
      padding: 10px 8px;
      border-radius: 8px;
      cursor: pointer;
      font: 500 11px/1.2 var(--font);
      text-align: center;
      transition: background .2s ease;
    }
    .cat-btn:hover { background: #202020; }
    .cat-btn small {
      display: block;
      color: var(--muted);
      font-size: 9px;
    }

    /* Always-on arrow strip (D-pad) */
    .arrow-strip {
      position: fixed;
      bottom: 14px;
      left: 160px; /* positioned right of glyph toggle */
      display: flex;
      gap: 4px;
      z-index: 15;
    }
    
    .arrow-btn {
      width: 36px;
      height: 28px;
      background: #131313;
      border: 1px solid #1e1e1e;
      border-radius: 6px;
      color: var(--fg);
      font: 600 16px/1 var(--mono);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    
    .arrow-btn:hover {
      background: #202020;
      border-color: #2a2a2a;
    }
    
    .style-btn {
      width: 48px;
      font-size: 10px;
      color: var(--muted);
    }
    
    /* Bottom toolbar for symbols (3 rows) */
    .toolbar {
      position: fixed; left: 0; right: 0; bottom: 0; height: var(--toolbar-h);
      border-top: 1px solid #161616;
      background: linear-gradient(0deg, rgba(0,0,0,.45), rgba(0,0,0,0));
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom)) 280px; /* more left padding for arrow strip */
      display: grid;
      grid-template-rows: repeat(3, 28px);
      grid-auto-flow: column;
      grid-auto-columns: max-content;
      gap: 6px 8px;
      overflow-x: auto;
      align-content: center;
    }
    .sym { 
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 40px; height: 32px; /* slightly larger for better touch */
      font: 600 18px/1 var(--mono);
      color: var(--fg);
      background: #131313; border: 1px solid #1e1e1e;
      border-radius: 10px; cursor: pointer;
      user-select: none;
    }
    .sym:hover { filter: brightness(1.15); }

    /* Hide scrollbars (still scrollable) */
    .history { scrollbar-width: none; }
    .history::-webkit-scrollbar { width: 0; height: 0; }

    /* Accessibility: respect reduced motion preference */
    @media (prefers-reduced-motion: reduce) {
      .history { scroll-behavior: auto; }
      .line { transition: none; }
    }
    
    /* Screenshot mode - hide chrome (press P) */
    body.screenshot-mode .topbar,
    body.screenshot-mode .toolbar,
    body.screenshot-mode .glyph-toggle,
    body.screenshot-mode .glyph-panel {
      display: none !important;
    }
    
    body.screenshot-mode .history-wrap {
      top: 20px;
      height: calc(45svh - 40px);
    }
    
    /* Responsive tweaks */
    @media (max-width: 520px) {
      :root { 
        --input-size: 36px;  /* scaled down for mobile but still comfortable */
        --line-size: 22px;    /* proportionally scaled */
        --center-gap: 18px;   /* tighter gap on mobile */
      }
      .menu-btn { padding: 8px 10px; }
      .dropdown { min-width: 200px; }
    }
  </style>
</head>
<body>
  <div class="topbar" aria-label="Menu">
    <button id="newNote" class="icon-btn" title="Create new note">➕</button>
    <button id="copyText" class="icon-btn" title="Copy current note">📋</button>
    <button id="exportTxt" class="icon-btn" title="Export as .txt">💾</button>
    <button id="increaseFont" class="icon-btn" title="Increase text size">🔍</button>
    <button id="decreaseFont" class="icon-btn" title="Decrease text size">🔎</button>
    <button id="clearAll" class="icon-btn" title="Clear current note">🗑</button>
    <button id="menuBtn" class="menu-btn" title="Notes">Notes ▾</button>
    <div id="menu" class="dropdown" role="menu" aria-hidden="true">
      <div id="notesList"></div>
    </div>
  </div>

  <main class="app" id="app" aria-label="Centered Notes">
    <section class="history-wrap">
      <div class="history" id="history" aria-live="polite"></div>
    </section>

    <section class="input-wrap">
      <div id="editor" class="input" contenteditable spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" data-placeholder="Type, then press Enter… (Shift+Enter for newline)"></div>
    </section>

    <div class="toolbar" id="toolbar" aria-label="Symbols toolbar"></div>
  </main>

  <div class="glyph-menu">
    <button id="glyphToggle" class="glyph-toggle">Glyphs ▲</button>
    <div id="glyphPanel" class="glyph-panel" aria-hidden="true">
      <div class="panel-tabs" style="display: flex; margin-bottom: 12px; border-bottom: 1px solid #333;">
        <button id="categoriesTab" class="panel-tab active" style="flex: 1; padding: 8px; background: none; border: none; color: var(--fg); cursor: pointer; border-bottom: 2px solid var(--accent);">Categories</button>
        <button id="favoritesTab" class="panel-tab" style="flex: 1; padding: 8px; background: none; border: none; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent;">Favorites</button>
      </div>
      
      <div id="categoriesView">
        <div class="search-section">
          <input type="text" id="glyphSearch" placeholder="Search symbols... (alpha, integral, arrow right)" 
                 style="width: 100%; padding: 8px; background: #0f0f0f; border: 1px solid #333; border-radius: 6px; color: var(--fg); font: 12px var(--font); margin-bottom: 12px;">
        </div>
        <div id="searchResults" style="display: none; max-height: 200px; overflow-y: auto; margin-bottom: 12px;"></div>
        <div id="categoryGrid" class="category-grid"></div>
        <div style="font-size: 11px; color: var(--muted); text-align: center; margin-top: 8px;">Select a category to load glyphs</div>
      </div>
      
      <div id="favoritesView" style="display: none;">
        <div id="favoritesList" style="max-height: 200px; overflow-y: auto;"></div>
        <div style="font-size: 11px; color: var(--muted); text-align: center; margin-top: 8px;">Alt/Option-click any glyph to add to favorites</div>
      </div>
    </div>
  </div>
  
  <!-- Always-on arrow strip -->
  <div class="arrow-strip">
    <button class="arrow-btn" data-arrow="←" title="Insert left arrow">←</button>
    <button class="arrow-btn" data-arrow="↑" title="Insert up arrow">↑</button>
    <button class="arrow-btn" data-arrow="↓" title="Insert down arrow">↓</button>
    <button class="arrow-btn" data-arrow="→" title="Insert right arrow">→</button>
    <button class="arrow-btn style-btn" id="arrowStyle" title="Cycle arrow styles">Thin</button>
  </div>

  <div class="hint">Enter → commit • Shift+Enter → newline • <kbd>Esc</kbd> → clear</div>

  <script>
    ;(() => {
      const STORAGE_KEY = 'centered-notes-v1';
      const NOTES_KEY = 'centered-notes-list';
      const state = {
        lines: [],
        lineSize: parseInt(getComputedStyle(document.documentElement).getPropertyValue('--line-size')),
        inputSize: parseInt(getComputedStyle(document.documentElement).getPropertyValue('--input-size')),
        currentNote: null,
        notes: []
      };
      
      // Glyph categories
      const categories = {
        'Greek': ['α','β','γ','δ','ε','ζ','η','θ','ι','κ','λ','μ','ν','ξ','ο','π','ρ','σ','τ','υ','φ','χ','ψ','ω','Γ','Δ','Θ','Λ','Ξ','Π','Σ','Φ','Ψ','Ω'],
        'Operators': ['±','×','÷','∙','⋅','·','≈','≠','≤','≥','≡','∝','∴','∵','∥','⊥','≅','≃','≜','∓','∂'],
        'Math': ['√','∛','∜','∑','∏','∫','∬','∭','∮','∞','∇','∆','∂','′','″','‴','°'],
        'Geometry': ['∠','⊾','∟','⟂','∥','⊙','⊕','⊗','⊡','△','▭','◻','◇','◯','∘'],
        'Chemistry': ['→','⇌','⇋','⇄','⇅','⇆','⟶','⟷','↑','↓','Å','°','•','⟨','⟩'],
        'Arrows': ['→','←','↑','↓','↔','↕','⇒','⇐','⇑','⇓','⇔','⟶','⟵','⟷'],
        'Currency': ['$','€','£','¥','₩','₹','₽','₺','₫','₴','₦','₪','₱','₿'],
        'Symbols': ['☀','☁','★','☆','☎','☑','☒','♠','♣','♥','♦','♪','♫','♬'],
        'Emoji': [],
        'Alchemical': [],
        'Ancient': []
      };
      let currentCategory = 'Greek';

      const historyEl = document.getElementById('history');
      const editor = document.getElementById('editor');
      const app = document.getElementById('app');
      const menu = document.getElementById('menu');
      const menuBtn = document.getElementById('menuBtn');
      const toolbar = document.getElementById('toolbar');
      const glyphToggle = document.getElementById('glyphToggle');
      const glyphPanel = document.getElementById('glyphPanel');
      const categoryGrid = document.getElementById('categoryGrid');
      const notesList = document.getElementById('notesList');

      // Focus editor on load and on background click
      window.addEventListener('load', () => editor.focus());
      app.addEventListener('pointerdown', (e) => {
        if (!menu.contains(e.target) && e.target !== menuBtn) {
          menu.classList.remove('open');
          editor.focus();
        }
      });

      // Toggle menu
      menuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        menu.classList.toggle('open');
        menu.setAttribute('aria-hidden', menu.classList.contains('open') ? 'false' : 'true');
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          // Close menu or clear input if menu is closed
          if (menu.classList.contains('open')) {
            menu.classList.remove('open');
            menu.setAttribute('aria-hidden', 'true');
          } else {
            editor.textContent = '';
          }
        }
      });

      // Load from storage
      function load() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            // Create default note
            createNewNote();
            return;
          }
          const data = JSON.parse(raw);
          if (Array.isArray(data.lines)) {
            state.lines = data.lines;
            renderHistory();
          }
          if (data.lineSize) setLineSize(data.lineSize);
          if (data.inputSize) setInputSize(data.inputSize);
          
          loadNotes();
        } catch (_) {}
      }

      function save() {
        const payload = {
          lines: state.lines,
          lineSize: state.lineSize,
          inputSize: state.inputSize
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        saveCurrentNote();
      }
      
      function loadNotes() {
        try {
          const raw = localStorage.getItem(NOTES_KEY);
          if (raw) {
            state.notes = JSON.parse(raw);
            renderNotesList();
          }
        } catch (_) {}
      }
      
      function saveNotes() {
        localStorage.setItem(NOTES_KEY, JSON.stringify(state.notes));
      }
      
      function createNewNote(customName = null) {
        const noteId = Date.now().toString();
        let title = 'New Note';
        if (customName) {
          title = customName;
        } else {
          const timestamp = new Date().toLocaleDateString('en-US', {
            month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
          });
          title = `Note ${timestamp}`;
        }
        const note = {
          id: noteId,
          title: title,
          lines: [],
          created: new Date().toISOString()
        };
        state.notes.push(note);
        state.currentNote = noteId;
        state.lines = [];
        renderHistory();
        saveNotes();
        renderNotesList();
      }
      
      function saveCurrentNote() {
        if (!state.currentNote) return;
        const note = state.notes.find(n => n.id === state.currentNote);
        if (note) {
          note.lines = [...state.lines];
          note.title = state.lines[0] || 'New Note';
          saveNotes();
          renderNotesList();
        }
      }
      
      function renderNotesList() {
        if (!notesList) return;
        notesList.innerHTML = '';
        
        if (state.notes.length === 0) {
          notesList.innerHTML = '<div class="empty-state">No notes yet</div>';
          return;
        }
        
        state.notes.forEach(note => {
          const div = document.createElement('div');
          div.className = 'note-item';
          div.textContent = note.title;
          div.title = note.title;
          div.addEventListener('click', () => {
            loadNote(note.id);
            menu.classList.remove('open');
          });
          notesList.appendChild(div);
        });
      }
      
      function loadNote(noteId) {
        const note = state.notes.find(n => n.id === noteId);
        if (note) {
          state.currentNote = noteId;
          state.lines = [...note.lines];
          renderHistory();
          save();
        }
      }

      // Render history lines (FIXED VERSION)
      function renderHistory() {
        historyEl.innerHTML = '';
        const frag = document.createDocumentFragment();
        state.lines.forEach((text, idx) => {
          const div = document.createElement('div');
          div.className = 'line';
          div.dataset.index = idx;
          div.textContent = text;
          frag.appendChild(div);
        });
        historyEl.appendChild(frag);
        // Scroll to bottom to show newest entries
        setTimeout(() => {
          historyEl.scrollTop = historyEl.scrollHeight;
        }, 0);
      }

      function addLine(text) {
        state.lines.push(text);
        renderHistory();
        save();
      }

      // Size helpers
      function setLineSize(px) {
        state.lineSize = Math.max(12, Math.min(28, px));
        document.documentElement.style.setProperty('--line-size', state.lineSize + 'px');
        save();
      }
      function setInputSize(px) {
        state.inputSize = Math.max(20, Math.min(56, px));
        document.documentElement.style.setProperty('--input-size', state.inputSize + 'px');
        save();
      }

      // Editor behavior
      editor.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          const text = editor.textContent.replace(/\s+$/,'');
          if (text.length) {
            addLine(text);
            editor.textContent = '';
          }
          return;
        }
      });

      // ====== Inline edit of submitted lines (double-click to avoid selection conflicts) ======
      historyEl.addEventListener('dblclick', (e) => {
        const target = e.target.closest('.line');
        if (!target || target.classList.contains('editing')) return;
        // Clear any text selection before editing
        window.getSelection().removeAllRanges();
        enterEdit(target);
      });
      
      // Prevent single click from interfering with text selection
      historyEl.addEventListener('click', (e) => {
        // Let text selection work naturally
        // Only start editing on double-click now
      });

      function enterEdit(el) {
        if (el.classList.contains('editing')) return;
        el.classList.add('editing');
        el.contentEditable = 'true';
        // move caret to end
        const range = document.createRange();
        range.selectNodeContents(el);
        range.collapse(false);
        const sel = window.getSelection();
        sel.removeAllRanges(); sel.addRange(range);

        function finish(commit) {
          el.removeEventListener('keydown', onKey);
          el.removeEventListener('blur', onBlur);
          el.contentEditable = 'false';
          el.classList.remove('editing');
          if (commit) {
            const idx = Number(el.dataset.index);
            state.lines[idx] = el.textContent;
            save();
          } else {
            renderHistory(); // discard uncommitted HTML
          }
        }
        function onKey(ev) {
          if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); finish(true); }
          if (ev.key === 'Escape') { ev.preventDefault(); finish(false); }
        }
        function onBlur() { finish(true); }
        el.addEventListener('keydown', onKey);
        el.addEventListener('blur', onBlur);
      }

      // Icon actions
      document.getElementById('newNote').addEventListener('click', () => {
        const noteName = prompt('Enter a name for your new note:', '');
        if (noteName !== null && noteName.trim() !== '') {
          createNewNote(noteName.trim());
        } else if (noteName !== null) {
          createNewNote(); // User entered empty name, use default
        }
        // If user cancelled (noteName === null), do nothing
        editor.focus();
      });
      
      document.getElementById('copyText').addEventListener('click', () => {
        const text = state.lines.join('\n');
        navigator.clipboard.writeText(text).then(() => {
          // Brief visual feedback
          const btn = document.getElementById('copyText');
          const original = btn.textContent;
          btn.textContent = '✓';
          setTimeout(() => btn.textContent = original, 800);
        }).catch(() => {
          // Fallback for older browsers
          const textArea = document.createElement('textarea');
          textArea.value = text;
          document.body.appendChild(textArea);
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
        });
      });
      
      document.getElementById('exportTxt').addEventListener('click', () => {
        const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
        const text = state.lines.join('\n');
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `centered-notes-${timestamp}.txt`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      });

      document.getElementById('increaseFont').addEventListener('click', () => {
        setInputSize(state.inputSize + 2);
        setLineSize(state.lineSize + 1);
      });
      
      document.getElementById('decreaseFont').addEventListener('click', () => {
        setInputSize(state.inputSize - 2);
        setLineSize(state.lineSize - 1);
      });

      document.getElementById('clearAll').addEventListener('click', () => {
        if (confirm('Clear current note? This cannot be undone.')) {
          state.lines = [];
          save();
          renderHistory();
        }
      });

      // Close dropdown when clicking outside
      document.addEventListener('pointerdown', (e) => {
        if (!menu.contains(e.target) && e.target !== menuBtn) {
          menu.classList.remove('open');
        }
      });

      // Category management and toolbar rendering
      function renderCategoryButtons() {
        if (!categoryGrid) return;
        categoryGrid.innerHTML = '';
        Object.entries(categories).forEach(([name, symbols]) => {
          const btn = document.createElement('button');
          btn.className = 'cat-btn';
          btn.innerHTML = `${name}<small>${symbols.length} glyphs</small>`;
          btn.addEventListener('click', () => {
            currentCategory = name;
            renderToolbar();
            glyphPanel.classList.remove('open');
          });
          categoryGrid.appendChild(btn);
        });
      }

      function renderToolbar() {
        if (!toolbar) return;
        toolbar.innerHTML = '';
        const symbols = categories[currentCategory] || [];
        symbols.forEach(s => {
          const b = document.createElement('button');
          b.className = 'sym';
          b.type = 'button';
          b.textContent = s;
          b.title = `Insert ${s} (Alt-click to favorite)`;
          b.addEventListener('click', (e) => {
            if (e.altKey || e.metaKey) {
              e.preventDefault();
              toggleFavorite(s, s);
              // Visual feedback
              b.style.borderColor = favorites.some(fav => fav.symbol === s) ? '#555' : '#1e1e1e';
            } else {
              insertAtCaret(getActiveEditable(), s);
            }
          });
          toolbar.appendChild(b);
        });
      }
      
      // Arrow strip functionality
      const arrowStyles = [
        { name: 'Thin', arrows: ['←', '↑', '↓', '→'] },
        { name: 'Double', arrows: ['⇐', '⇑', '⇓', '⇒'] },
        { name: 'Long', arrows: ['⟵', '⟶', '⟶', '⟶'] },
        { name: 'Bold', arrows: ['⬅', '⬆', '⬇', '➡'] }
      ];
      
      let currentArrowStyle = parseInt(localStorage.getItem('arrowStyle') || '0');
      
      function updateArrowStrip() {
        const style = arrowStyles[currentArrowStyle];
        const arrowBtns = document.querySelectorAll('.arrow-btn[data-arrow]');
        const arrows = style.arrows;
        
        arrowBtns[0].textContent = arrows[0]; // left
        arrowBtns[1].textContent = arrows[1]; // up
        arrowBtns[2].textContent = arrows[2]; // down
        arrowBtns[3].textContent = arrows[3]; // right
        
        document.getElementById('arrowStyle').textContent = style.name;
      }
      
      // Arrow insertion with thin spaces
      function insertArrow(arrow) {
        const thinSpace = '\u2009';
        const arrowWithSpaces = thinSpace + arrow + thinSpace;
        insertAtCaret(getActiveEditable(), arrowWithSpaces);
      }
      
      // Arrow strip event listeners
      document.querySelectorAll('.arrow-btn[data-arrow]').forEach(btn => {
        btn.addEventListener('click', () => {
          insertArrow(btn.textContent);
        });
      });
      
      document.getElementById('arrowStyle').addEventListener('click', () => {
        currentArrowStyle = (currentArrowStyle + 1) % arrowStyles.length;
        localStorage.setItem('arrowStyle', currentArrowStyle.toString());
        updateArrowStrip();
      });
      
      updateArrowStrip();
      
      // Smart text expansions
      const textExpansions = {
        '->': '→',   // right arrow
        '<-': '←',   // left arrow
        '<->': '↔',  // left-right arrow
        '=>': '⇒',   // double right arrow (implies)
        '<=': '⇐',   // double left arrow
        '<=>': '⇔',  // double left-right arrow (iff)
        '-->': '⟶',  // long right arrow
        '<--': '⟵',  // long left arrow
        '=/=': '≠',  // not equal
        '+-': '±',   // plus-minus
        '>=': '≥',   // greater than or equal
        '<=': '≤',   // less than or equal (conflicts with arrow, arrows take priority)
        '~=': '≈'    // approximately equal
      };
      
      function performSmartExpansion(editor) {
        const selection = window.getSelection();
        if (!selection.rangeCount) return false;
        
        const range = selection.getRangeAt(0);
        const textNode = range.startContainer;
        
        if (textNode.nodeType !== Node.TEXT_NODE) return false;
        
        const text = textNode.textContent;
        const cursorPos = range.startOffset;
        
        // Look for expansion patterns before cursor
        for (const [pattern, replacement] of Object.entries(textExpansions)) {
          const patternStart = cursorPos - pattern.length;
          if (patternStart >= 0) {
            const precedingText = text.substring(patternStart, cursorPos);
            if (precedingText === pattern) {
              // Check if it's at word boundary (start of text or after space/punctuation)
              const beforePattern = patternStart > 0 ? text[patternStart - 1] : ' ';
              if (/\s|^|[.,!?;:]/.test(beforePattern)) {
                // Replace with thin-spaced arrow
                const thinSpace = '\u2009';
                const replacementText = thinSpace + replacement + thinSpace;
                
                range.setStart(textNode, patternStart);
                range.setEnd(textNode, cursorPos);
                range.deleteContents();
                range.insertNode(document.createTextNode(replacementText));
                
                // Move cursor after the replacement
                range.setStartAfter(range.endContainer);
                range.collapse(true);
                selection.removeAllRanges();
                selection.addRange(range);
                
                return true;
              }
            }
          }
        }
        return false;
      }
      
      // Smart expansion trigger on space and Enter
      editor.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Enter') {
          // Small delay to let the character be inserted first
          setTimeout(() => {
            if (e.key === ' ') {
              performSmartExpansion(editor);
            }
          }, 0);
        }
        // For Enter, check before the newline
        if (e.key === 'Enter' && !e.shiftKey) {
          performSmartExpansion(editor);
        }
      });
      
      // Search functionality with aliases
      const glyphAliases = {
        // Greek letters
        'alpha': 'α', 'beta': 'β', 'gamma': 'γ', 'delta': 'δ', 'epsilon': 'ε',
        'zeta': 'ζ', 'eta': 'η', 'theta': 'θ', 'iota': 'ι', 'kappa': 'κ',
        'lambda': 'λ', 'mu': 'μ', 'nu': 'ν', 'xi': 'ξ', 'omicron': 'ο',
        'pi': 'π', 'rho': 'ρ', 'sigma': 'σ', 'tau': 'τ', 'upsilon': 'υ',
        'phi': 'φ', 'chi': 'χ', 'psi': 'ψ', 'omega': 'ω',
        
        // Math symbols
        'integral': '∫', 'double integral': '∬', 'triple integral': '∭',
        'sum': '∑', 'product': '∏', 'sqrt': '√', 'cbrt': '∛',
        'proportional': '∝', 'infinity': '∞', 'approx': '≈', 'not equal': '≠',
        'less equal': '≤', 'greater equal': '≥', 'plus minus': '±', 'minus plus': '∓',
        'perpendicular': '⊥', 'parallel': '∥', 'angle': '∠', 'nabla': '∇',
        'partial': '∂', 'hbar': 'ℏ', 'ohm': 'Ω', 'degree': '°',
        
        // Arrows
        'arrow left': '←', 'arrow up': '↑', 'arrow right': '→', 'arrow down': '↓',
        'left arrow': '←', 'up arrow': '↑', 'right arrow': '→', 'down arrow': '↓',
        'implies': '⇒', 'double arrow right': '⇒', 'iff': '⇔', 'double arrow left': '⇐',
        'long right': '⟶', 'long left': '⟵', 'two way': '↔', 'reversible': '⇌',
        
        // Chemistry
        'equilibrium': '⇌', 'precipitate': '↓', 'gas': '↑', 'angstrom': 'Å',
        'bullet': '•', 'middle dot': '·',
        
        // Currency
        'bitcoin': '₿', 'euro': '€', 'yen': '¥', 'pound': '£',
        'dollar': '$', 'cent': '¢', 'shekel': '₪', 'rupee': '₹'
      };
      
      function performSearch(query) {
        if (!query.trim()) return [];
        
        const results = [];
        const lowerQuery = query.toLowerCase();
        
        // Search aliases
        for (const [alias, symbol] of Object.entries(glyphAliases)) {
          if (alias.includes(lowerQuery)) {
            results.push({ symbol, name: alias, type: 'alias' });
          }
        }
        
        // Direct character search (if query is a single character)
        if (query.length === 1) {
          results.push({ symbol: query, name: `Character: ${query}`, type: 'direct' });
        }
        
        // Limit results for performance
        return results.slice(0, 50);
      }
      
      function renderSearchResults(results) {
        const container = document.getElementById('searchResults');
        const categoryGrid = document.getElementById('categoryGrid');
        
        if (results.length === 0) {
          container.style.display = 'none';
          categoryGrid.style.display = 'grid';
          return;
        }
        
        container.style.display = 'block';
        categoryGrid.style.display = 'none';
        
        container.innerHTML = '';
        
        results.forEach(result => {
          const btn = document.createElement('button');
          btn.className = 'sym';
          btn.textContent = result.symbol;
          btn.title = `Insert ${result.name} (${result.symbol})`;
          btn.style.margin = '2px';
          btn.addEventListener('click', (e) => {
            if (e.altKey || e.metaKey) {
              e.preventDefault();
              toggleFavorite(result.symbol, result.name);
              // Visual feedback
              btn.style.borderColor = favorites.some(fav => fav.symbol === result.symbol) ? '#555' : '#1e1e1e';
            } else {
              insertAtCaret(getActiveEditable(), result.symbol);
              glyphPanel.classList.remove('open');
              glyphToggle.textContent = 'Glyphs ▲';
            }
          });
          container.appendChild(btn);
        });
      }
      
      // Search input event listener
      const searchInput = document.getElementById('glyphSearch');
      searchInput.addEventListener('input', (e) => {
        const results = performSearch(e.target.value);
        renderSearchResults(results);
      });
      
      // Clear search when panel closes
      const clearSearch = () => {
        searchInput.value = '';
        renderSearchResults([]);
      };
      
      // Favorites system
      let favorites = JSON.parse(localStorage.getItem('glyphFavorites') || '[]');
      
      function saveFavorites() {
        localStorage.setItem('glyphFavorites', JSON.stringify(favorites));
      }
      
      function toggleFavorite(symbol, name = '') {
        const index = favorites.findIndex(fav => fav.symbol === symbol);
        if (index >= 0) {
          favorites.splice(index, 1);
        } else {
          favorites.push({ symbol, name: name || symbol });
        }
        saveFavorites();
        if (document.getElementById('favoritesView').style.display !== 'none') {
          renderFavorites();
        }
      }
      
      function renderFavorites() {
        const container = document.getElementById('favoritesList');
        container.innerHTML = '';
        
        if (favorites.length === 0) {
          container.innerHTML = '<div style="color: var(--muted); text-align: center; padding: 20px;">No favorites yet. Alt-click any glyph to add it!</div>';
          return;
        }
        
        favorites.forEach(fav => {
          const btn = document.createElement('button');
          btn.className = 'sym';
          btn.textContent = fav.symbol;
          btn.title = `${fav.name} (Alt-click to remove)`;
          btn.style.margin = '2px';
          btn.style.position = 'relative';
          
          // Add favorite indicator
          btn.style.borderColor = '#444';
          
          btn.addEventListener('click', (e) => {
            if (e.altKey || e.metaKey) {
              e.preventDefault();
              toggleFavorite(fav.symbol);
            } else {
              insertAtCaret(getActiveEditable(), fav.symbol);
              glyphPanel.classList.remove('open');
              glyphToggle.textContent = 'Glyphs ▲';
            }
          });
          
          container.appendChild(btn);
        });
      }
      
      // Tab switching
      document.getElementById('categoriesTab').addEventListener('click', () => {
        document.getElementById('categoriesView').style.display = 'block';
        document.getElementById('favoritesView').style.display = 'none';
        document.getElementById('categoriesTab').className = 'panel-tab active';
        document.getElementById('categoriesTab').style.color = 'var(--fg)';
        document.getElementById('categoriesTab').style.borderBottomColor = 'var(--accent)';
        document.getElementById('favoritesTab').className = 'panel-tab';
        document.getElementById('favoritesTab').style.color = 'var(--muted)';
        document.getElementById('favoritesTab').style.borderBottomColor = 'transparent';
      });
      
      document.getElementById('favoritesTab').addEventListener('click', () => {
        document.getElementById('categoriesView').style.display = 'none';
        document.getElementById('favoritesView').style.display = 'block';
        document.getElementById('favoritesTab').className = 'panel-tab active';
        document.getElementById('favoritesTab').style.color = 'var(--fg)';
        document.getElementById('favoritesTab').style.borderBottomColor = 'var(--accent)';
        document.getElementById('categoriesTab').className = 'panel-tab';
        document.getElementById('categoriesTab').style.color = 'var(--muted)';
        document.getElementById('categoriesTab').style.borderBottomColor = 'transparent';
        renderFavorites();
      });
      
      // Glyph panel toggle
      if (glyphToggle && glyphPanel) {
        glyphToggle.addEventListener('click', () => {
          const open = glyphPanel.classList.toggle('open');
          glyphPanel.setAttribute('aria-hidden', open ? 'false' : 'true');
          glyphToggle.textContent = open ? 'Glyphs ▼' : 'Glyphs ▲';
          if (!open) clearSearch(); // Clear search when closing
        });
        // This is handled above now
        
        // Close panel when clicking outside
        document.addEventListener('click', (e) => {
          if (!glyphToggle.contains(e.target) && !glyphPanel.contains(e.target)) {
            glyphPanel.classList.remove('open');
            glyphPanel.setAttribute('aria-hidden', 'true');
            glyphToggle.textContent = 'Glyphs ▲';
          }
        });
      }

      function getActiveEditable(){
        const editing = document.querySelector('.line.editing');
        return editing || editor;
      }

      function insertAtCaret(el,text){
        el.focus();
        const sel=window.getSelection();
        if(!sel||!sel.rangeCount){ el.textContent+=text; return; }
        const range=sel.getRangeAt(0);
        range.deleteContents();
        range.insertNode(document.createTextNode(text));
        range.collapse(false);
        sel.removeAllRanges(); sel.addRange(range);
      }

      // Initialize
      // Screenshot mode toggle (P key)
      document.addEventListener('keydown', (e) => {
        if (e.key === 'p' || e.key === 'P') {
          // Only toggle if not typing in input areas
          if (!e.target.isContentEditable && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
            e.preventDefault();
            document.body.classList.toggle('screenshot-mode');
          }
        }
      });
      
      // Load expanded Unicode categories
      function loadEmojiCategory() {
        categories['Emoji'] = [
          // Smileys
          '😀','😃','😄','😁','😅','😂','🤣','😊','😇','🙂','🙃','😉','😌','😍','🥰','😘','😗','😙','😚','😋','😛','😝','😜','🤪','🤨','🧐','🤓','😎','🥸','🤩','🥳',
          // Gestures
          '👍','👎','👏','🙌','👐','🤲','🤝','🙏','✍','👋','🤚','🖐','✋','🖖','👌','✌','🤘','🤙','👈','👉','👆','👇','☝',
          // Nature
          '🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🙈','🙉','🙊','🐒','🐔','🐧',
          // Hearts & Symbols
          '❤','💙','💚','💛','🧡','💜','🖤','🤍','🤎','💔','❣','💕','💞','💓','💗','💖','💘','💝','💟',
          // Weather
          '☀','🌤','⛅','🌦','🌧','⛈','🌩','🌨','❄','☃','⛄','🌪','🌈','🌙','⭐','🌟','💫','✨','☄','🌍','🌎','🌏'
        ];
      }
      
      function loadAlchemicalCategory() {
        categories['Alchemical'] = [
          // Classical elements
          '🜀','🜁','🜂','🜃','🜄','🜅','🜆','🜇','🜈','🜉','🜊','🜋','🜌','🜍','🜎','🜏',
          // Metals
          '🜐','🜑','🜒','🜓','🜔','🜕','🜖','🜗','🜘','🜙','🜚','🜛','🜜','🜝','🜞','🜟',
          // Compounds
          '🜠','🜡','🜢','🜣','🜤','🜥','🜦','🜧','🜨','🜩','🜪','🜫','🜬','🜭','🜮','🜯',
          // Processes
          '🜰','🜱','🜲','🜳','🜴','🜵','🜶','🜷','🜸','🜹','🜺','🜻','🜼','🜽','🜾','🜿'
        ];
      }
      
      function loadAncientCategory() {
        categories['Ancient'] = [
          // Ancient symbols
          '⚚','⚛','⚜','⚝','⚞','⚟','⚠','⚡','⚢','⚣','⚤','⚥','⚦','⚧','⚨','⚩','⚪','⚫',
          // Misc ancient symbols
          '☤','☥','☧','☨','☩','☪','☫','☬','☭','☮','☯','☰','☱','☲','☳','☴','☵','☶','☷','♆','♇',
          // Additional esoteric symbols
          '⚕','⚖','⚗','⚘','⚙','⚰','⚱','⚲','⚳','⚴','⚵','⚶','⚷','⚸','⚹','⚺','⚻','⚼','⚽','⚾','⚿'
        ];
      }
      
      // Load all extended categories
      loadEmojiCategory();
      loadAlchemicalCategory();
      loadAncientCategory();
      
      renderCategoryButtons();
      renderToolbar();
      load();
    })();
  </script>
