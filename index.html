<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <title>Centered Notes</title>
  <style>
    :root {
      --bg: #0b0b0b;
      --fg: #e9e9e9;
      --muted: #8a8a8a;
      --accent: #b3b3b3;
      --danger: #ff5d5d;
      --line-size: 18px;      /* history text size */
      --input-size: 30px;     /* input text size */
      --ui-size: 14px;
      --max-width: 1000px;
      --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Layout: history (scrolling) / input (fixed center) / spacer */
    .app {
      height: 100vh;
      width: 100vw;
      display: grid;
      grid-template-rows: 1fr auto 96px; /* bottom toolbar keeps input centered */
      align-items: center;
      justify-items: center;
      overflow: hidden;
    }

    .inner {
      width: min(100%, var(--max-width));
      padding: 24px clamp(16px, 4vw, 40px);
    }

    /* Minimal top menu button */
    .topbar {
      position: fixed;
      top: 10px;
      right: 12px;
      z-index: 10;
      user-select: none;
    }
    .menu-btn {
      font: 600 var(--ui-size)/1 var(--font);
      color: var(--fg);
      background: transparent;
      border: 1px solid #222;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity .2s ease, background .2s ease, border-color .2s ease;
    }
    .menu-btn:hover { opacity: 1; border-color: #333; background: #111; }

    .dropdown {
      position: absolute;
      top: 40px;
      right: 0;
      min-width: 220px;
      background: #0f0f0f;
      border: 1px solid #1e1e1e;
      border-radius: 12px;
      padding: 6px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.55);
      display: none;
    }
    .dropdown.open { display: block; }
    .dropdown button, .dropdown a {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      color: var(--fg);
      font: 500 var(--ui-size)/1.2 var(--font);
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    .dropdown button:hover, .dropdown a:hover { background: #161616; }
    .danger { color: var(--danger); }
    .separator { height: 1px; background: #1a1a1a; margin: 6px 0; border-radius: 1px; }

    /* History list (top area) */
    .history-wrap {
      align-self: end;
      width: min(100%, var(--max-width));
      height: 100%;
      overflow: hidden; /* container hidden to keep minimal visuals */
    }
    .history {
      height: 100%;
      overflow-y: auto;
      padding: 0 clamp(16px, 4vw, 40px) 6px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end; /* keep last items near the input */
      gap: 8px;
      scroll-behavior: smooth;
    }

    .line { 
      font-size: var(--line-size);
      line-height: 1.6;
      color: var(--accent);
      word-break: break-word;
      white-space: pre-wrap;
      opacity: .9;
    }

    .line.editing {
      background: rgba(255,255,255,0.05);
      padding: 4px 8px;
      border-radius: 6px;
      outline: 1px solid var(--accent);
    }

    /* Center input */
    .input-wrap { 
      width: min(100%, var(--max-width));
      /* Fixed position so the editor is always vertically centered in the usable viewport */
      position: fixed;
      left: 50%;
      top: calc((100vh - 96px) / 2); /* center between top and the 96px toolbar */
      transform: translate(-50%, -50%);
      padding: 0 clamp(16px, 4vw, 40px);
      display: grid;
      place-items: center;
      z-index: 5;
    }

    .input {
      width: 100%;
      outline: none;
      border: 0;
      background: transparent;
      caret-color: var(--fg);
      color: var(--fg);
      font-family: var(--mono);
      font-size: var(--input-size);
      line-height: 1.5;
      text-align: center;
      min-height: calc(var(--input-size) * 1.5);
    }

    /* Contenteditable placeholder */
    .input[contenteditable][data-placeholder]:empty::before {
      content: attr(data-placeholder);
      pointer-events: none;
      color: var(--muted);
    }

    /* Bottom spacer (keeps input centered) */
    .spacer { height: 100%; }

    /* Little hint at the bottom-left */
    .hint {
      position: fixed;
      left: 14px;
      bottom: 12px;
      color: var(--muted);
      font: 500 12px/1.4 var(--mono);
      opacity: .75;
      user-select: none;
    }
    .hint kbd {
      background: #121212;
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid #1f1f1f;
      font-family: var(--mono);
    }

    /* Bottom toolbar for symbols (3 rows) */
    .toolbar {
      position: fixed; left: 0; right: 0; bottom: 0; height: 96px;
      border-top: 1px solid #161616;
      background: linear-gradient(0deg, rgba(0,0,0,.45), rgba(0,0,0,0));
      padding: 8px 10px;
      display: grid;
      grid-template-rows: repeat(3, 28px);
      grid-auto-flow: column;
      grid-auto-columns: max-content;
      gap: 6px 8px;
      overflow-x: auto;
      align-content: center;
    }
    .sym { 
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 36px; height: 28px;
      font: 600 16px/1 var(--mono);
      color: var(--fg);
      background: #131313; border: 1px solid #1e1e1e;
      border-radius: 10px; cursor: pointer;
      user-select: none;
    }
    .sym:hover { filter: brightness(1.15); }

    /* Hide scrollbars (still scrollable) */
    .history { scrollbar-width: none; }
    .history::-webkit-scrollbar { width: 0; height: 0; }

    /* Responsive tweaks */
    @media (max-width: 520px) {
      :root { --input-size: 26px; --line-size: 16px; }
      .menu-btn { padding: 8px 10px; }
      .dropdown { min-width: 200px; }
    }
  </style>
</head>
<body>
  <div class="topbar" aria-label="Menu">
    <button id="menuBtn" class="menu-btn" title="Menu">Menu ▾</button>
    <div id="menu" class="dropdown" role="menu" aria-hidden="true">
      <button id="exportTxt" role="menuitem">Export as .txt</button>
      <button id="increaseFont" role="menuitem">Increase text size</button>
      <button id="decreaseFont" role="menuitem">Decrease text size</button>
      <div class="separator"></div>
      <button id="clearAll" class="danger" role="menuitem">Clear all</button>
      <div class="separator"></div>
      <button id="help" role="menuitem">Help / Shortcuts</button>
    </div>
  </div>

  <main class="app" id="app" aria-label="Centered Notes">
    <section class="history-wrap">
      <div class="history" id="history" aria-live="polite"></div>
    </section>

    <section class="input-wrap">
      <div id="editor" class="input" contenteditable spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" data-placeholder="Type, then press Enter… (Shift+Enter for newline)"></div>
    </section>

    <div class="toolbar" id="toolbar" aria-label="Symbols toolbar"></div>
  </main>

  <div class="hint">Enter → commit line • Shift+Enter → newline • <kbd>Esc</kbd> → clear current</div>

  <script>
    ;(() => {
      const STORAGE_KEY = 'centered-notes-v1';
      const state = {
        lines: [],
        lineSize: parseInt(getComputedStyle(document.documentElement).getPropertyValue('--line-size')),
        inputSize: parseInt(getComputedStyle(document.documentElement).getPropertyValue('--input-size'))
      };

      const historyEl = document.getElementById('history');
      const editor = document.getElementById('editor');
      const app = document.getElementById('app');
      const menu = document.getElementById('menu');
      const menuBtn = document.getElementById('menuBtn');

      // Focus editor on load and on background click
      window.addEventListener('load', () => editor.focus());
      app.addEventListener('pointerdown', (e) => {
        if (!menu.contains(e.target) && e.target !== menuBtn) {
          menu.classList.remove('open');
          editor.focus();
        }
      });

      // Toggle menu
      menuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        menu.classList.toggle('open');
        menu.setAttribute('aria-hidden', menu.classList.contains('open') ? 'false' : 'true');
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          // Close menu or clear input if menu is closed
          if (menu.classList.contains('open')) {
            menu.classList.remove('open');
            menu.setAttribute('aria-hidden', 'true');
          } else {
            editor.textContent = '';
          }
        }
      });

      // Load from storage
      function load() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          const data = JSON.parse(raw);
          if (Array.isArray(data.lines)) {
            state.lines = data.lines;
            renderHistory();
          }
          if (data.lineSize) setLineSize(data.lineSize);
          if (data.inputSize) setInputSize(data.inputSize);
        } catch (_) {}
      }

      function save() {
        const payload = {
          lines: state.lines,
          lineSize: state.lineSize,
          inputSize: state.inputSize
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      }

      // Render history lines (FIXED VERSION)
      function renderHistory() {
        historyEl.innerHTML = '';
        const frag = document.createDocumentFragment();
        state.lines.forEach((text, idx) => {
          const div = document.createElement('div');
          div.className = 'line';
          div.dataset.index = idx;
          div.textContent = text;
          frag.appendChild(div);
        });
        historyEl.appendChild(frag);
        historyEl.scrollTop = historyEl.scrollHeight;
      }

      function addLine(text) {
        state.lines.push(text);
        const div = document.createElement('div');
        div.className = 'line';
        div.dataset.index = state.lines.length - 1;
        div.textContent = text;
        historyEl.appendChild(div);
        historyEl.scrollTop = historyEl.scrollHeight;
        save();
      }

      // Size helpers
      function setLineSize(px) {
        state.lineSize = Math.max(12, Math.min(28, px));
        document.documentElement.style.setProperty('--line-size', state.lineSize + 'px');
        save();
      }
      function setInputSize(px) {
        state.inputSize = Math.max(20, Math.min(56, px));
        document.documentElement.style.setProperty('--input-size', state.inputSize + 'px');
        save();
      }

      // Editor behavior
      editor.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          const text = editor.textContent.replace(/\s+$/,'');
          if (text.length) {
            addLine(text);
            editor.textContent = '';
          }
          return;
        }
      });

      // ====== Inline edit of submitted lines ======
      historyEl.addEventListener('dblclick', (e) => {
        const target = e.target.closest('.line');
        if (!target) return;
        enterEdit(target);
      });

      function enterEdit(el) {
        if (el.classList.contains('editing')) return;
        el.classList.add('editing');
        el.contentEditable = 'true';
        // move caret to end
        const range = document.createRange();
        range.selectNodeContents(el);
        range.collapse(false);
        const sel = window.getSelection();
        sel.removeAllRanges(); sel.addRange(range);

        function finish(commit) {
          el.removeEventListener('keydown', onKey);
          el.removeEventListener('blur', onBlur);
          el.contentEditable = 'false';
          el.classList.remove('editing');
          if (commit) {
            const idx = Number(el.dataset.index);
            state.lines[idx] = el.textContent;
            save();
          } else {
            renderHistory(); // discard uncommitted HTML
          }
        }
        function onKey(ev) {
          if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); finish(true); }
          if (ev.key === 'Escape') { ev.preventDefault(); finish(false); }
        }
        function onBlur() { finish(true); }
        el.addEventListener('keydown', onKey);
        el.addEventListener('blur', onBlur);
      }

      // Menu actions
      document.getElementById('exportTxt').addEventListener('click', () => {
        const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
        const text = state.lines.join('\n');
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `centered-notes-${timestamp}.txt`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        menu.classList.remove('open');
      });

      document.getElementById('increaseFont').addEventListener('click', () => {
        setInputSize(state.inputSize + 2);
        setLineSize(state.lineSize + 1);
      });
      document.getElementById('decreaseFont').addEventListener('click', () => {
        setInputSize(state.inputSize - 2);
        setLineSize(state.lineSize - 1);
      });

      document.getElementById('clearAll').addEventListener('click', () => {
        if (confirm('Clear all notes? This cannot be undone.')) {
          state.lines = [];
          save();
          renderHistory();
        }
        menu.classList.remove('open');
      });

      document.getElementById('help').addEventListener('click', () => {
        alert('Centered Notes\n\n• Enter: commit line to history (input stays centered)\n• Shift+Enter: newline within the current entry\n• Esc: clear current entry or close menu\n• Double-click any line to edit it inline\n• Export .txt from the Menu\n• Font size controls in Menu\n• Data persists locally in your browser (localStorage).');
        menu.classList.remove('open');
      });

      // Close dropdown when clicking outside
      document.addEventListener('pointerdown', (e) => {
        if (!menu.contains(e.target) && e.target !== menuBtn) {
          menu.classList.remove('open');
        }
      });

      // Symbols toolbar (3 rows) — math / chem / glyphs
      const toolbar = document.getElementById('toolbar');
      const symbols = ['π','θ','Σ','∞','±','≈','≠','≤','≥','×','÷','√','∫','∑','Δ','μ','λ','α','β','γ','Ω','°','→','↔','≡','∘','⋅','∂','Å','‰','ƒ','∇','∝','∴','∵','∩','∪','⊂','⊃','⊆','⊇','∈','∉','∅','⇌','↑','↓','•','℃','§','η','ϕ','ψ','χ','ω','⊗','⊕','∥','⊥','∠','∽','∝','≈','≅','≜','⌈','⌉','⌊','⌋','∞'];

      function renderToolbar(){
        if (!toolbar) return;
        toolbar.innerHTML='';
        symbols.forEach(s=>{
          const b=document.createElement('button');
          b.className='sym'; b.type='button'; b.textContent=s; b.title='Insert '+s;
          b.addEventListener('click',()=>insertAtCaret(getActiveEditable(),s));
          toolbar.appendChild(b);
        });
      }

      function getActiveEditable(){
        const editing = document.querySelector('.line.editing');
        return editing || editor;
      }

      function insertAtCaret(el,text){
        el.focus();
        const sel=window.getSelection();
        if(!sel||!sel.rangeCount){ el.textContent+=text; return; }
        const range=sel.getRangeAt(0);
        range.deleteContents();
        range.insertNode(document.createTextNode(text));
        range.collapse(false);
        sel.removeAllRanges(); sel.addRange(range);
      }

      // Initialize
      renderToolbar();
      load();
    })();
  </script>
</body>
</html>
